<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETA2 - Party Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- PANTALLA 1: INICIO -->
    <div id="home-screen" class="screen active">
        <div class="logo-placeholder cartoon-box"><i class="fa-solid fa-gamepad"></i></div>
        <h1>RETA2 PARTY</h1>
        <div class="player-input-container">
            <input type="text" id="player-name" placeholder="Nombre del jugador" maxlength="12">
            <button class="cartoon-btn" id="btn-add-player">Añadir</button>
        </div>
        <div class="player-list" id="player-list"></div>
        <button class="cartoon-btn" style="background-color: #ff6b6b; color: white;" onclick="window.goToScreen('menu-screen')">¡JUGAR!</button>
    </div>

    <!-- PANTALLA 2: SELECCIÓN -->
    <div id="menu-screen" class="screen">
        <div class="top-bar">
            <button class="cartoon-btn" onclick="window.goToScreen('home-screen')"><i class="fa-solid fa-house"></i></button>
        </div>
        <h2>ELIGE MINIJUEGO</h2>
        <div class="game-menu">
            <div class="game-card cartoon-box" style="background-color: #4ECDC4;" id="btn-play-oca">
                <i class="fa-solid fa-dice"></i> LA OCA
            </div>
            <div class="game-card cartoon-box" style="background-color: #FF6B6B;" id="btn-play-ruleta">
                <i class="fa-solid fa-dharmachakra"></i> LA RULETA
            </div>
            <div class="game-card cartoon-box game-card-slot" style="color: black;" id="btn-play-maquinita">
                <span class="slot-card-icon">
                    <i class="fa-solid fa-coins"></i>
                    <span class="slot-card-777">777</span>
                </span>
                LA MAQUINITA
            </div>
        </div>
    </div>

    <!-- PANTALLA 3: LA OCA -->
    <div id="oca-screen" class="screen">
        <div class="top-bar">
            <button class="cartoon-btn" onclick="window.goToScreen('menu-screen')"><i class="fa-solid fa-house"></i></button>
        </div>

        <div class="oca-main-content">
            <!-- PLAYER INDEX -->
            <div id="player-index" class="cartoon-box">
                <h3>Jugadores</h3>
                <div id="player-index-list"></div>
            </div>

            <div class="oca-board-area">
                <div class="game-ui">
                    <h2 id="turn-indicator">Turno de: ...</h2>
                    <button class="cartoon-btn" id="show-dice-btn">Tirar Dado</button>
                </div>
                <div class="board-container" id="oca-board"></div>
            </div>
        </div>
    </div>

    <!-- PANTALLA 4: LA RULETA -->
    <div id="ruleta-screen" class="screen">
        <div class="top-bar">
            <button class="cartoon-btn" onclick="window.goToScreen('menu-screen')"><i class="fa-solid fa-house"></i></button>
        </div>
        
        <div class="ruleta-container">
            <h2 id="ruleta-turn-indicator">Turno de: ...</h2>
            
            <div class="wheel-wrapper">
                <div class="wheel-pointer">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div id="ruleta-wheel" class="wheel"></div>
            </div>
            <p class="ruleta-hint">Arrastra para girar</p>
        </div>
    </div>

    <!-- DADO Y MODAL -->
    <div id="dice-canvas-container">
        <div id="dice-instructions">Mantén pulsado para dar fuerza</div>
        <div id="strength-bar-container">
            <div id="strength-bar"></div>
        </div>
        <div class="scene">
            <div class="cube" id="dice-cube">
                <div class="cube__face cube__face--front">1</div>
                <div class="cube__face cube__face--back"><u>6</u></div>
                <div class="cube__face cube__face--right">3</div>
                <div class="cube__face cube__face--left">4</div>
                <div class="cube__face cube__face--top">2</div>
                <div class="cube__face cube__face--bottom">5</div>
            </div>
        </div>
    </div>

    <!-- PANTALLA 5: LA MAQUINITA -->
    <div id="maquinita-screen" class="screen">
        <div class="top-bar">
            <button class="cartoon-btn" onclick="window.goToScreen('menu-screen')"><i class="fa-solid fa-house"></i></button>
        </div>

        <div class="slot-stage" id="slot-stage">
            <div class="slot-machine cartoon-box" id="slot-machine">
                <div class="slot-marquee">
                    <div class="bulbs bulbs-top" id="bulbs-top"></div>
                    <h2><i class="fa-solid fa-coins"></i> LA MAQUINITA <i class="fa-solid fa-coins"></i></h2>
                    <div class="marquee-sub">JACKPOT&nbsp;·&nbsp;777&nbsp;·&nbsp;JACKPOT</div>
                    <div class="bulbs bulbs-bottom" id="bulbs-bottom"></div>
                </div>

                <div class="slot-window">
                    <div class="reel-col">
                        <div class="reel-label"><i class="fa-solid fa-user"></i> JUGADOR</div>
                        <div class="reel-viewport" id="viewport-1">
                            <div class="slot-reel" id="reel-1"><div class="slot-item golden-item"><span class="q-mark">?</span></div></div>
                        </div>
                    </div>
                    <div class="reel-col">
                        <div class="reel-label"><i class="fa-solid fa-user"></i> JUGADOR</div>
                        <div class="reel-viewport" id="viewport-2">
                            <div class="slot-reel" id="reel-2"><div class="slot-item golden-item"><span class="q-mark">?</span></div></div>
                        </div>
                    </div>
                    <div class="reel-col">
                        <div class="reel-label"><i class="fa-solid fa-bolt"></i> RETO</div>
                        <div class="reel-viewport" id="viewport-3">
                            <div class="slot-reel" id="reel-3"><div class="slot-item golden-item"><span class="q-mark">?</span></div></div>
                        </div>
                    </div>
                    <div class="payline"></div>
                </div>

                <div class="slot-controls">
                    <div class="slot-hint">
                        <span class="hint-q">?</span><span class="hint-q">?</span><span class="hint-q">?</span>
                        <span class="hint-text">= RETO DE ORO</span>
                    </div>
                    <button class="cartoon-btn" id="btn-spin-slot"><i class="fa-solid fa-play"></i> ¡TIRAR!</button>
                    <div class="slot-lever" id="slot-lever"><div class="lever-stick"></div><div class="lever-ball"></div></div>
                </div>
            </div>

            <div id="slot-win-banner"><span></span></div>
            <div id="slot-particles" class="particle-layer"></div>
        </div>
    </div>

    <!-- MODAL (Compartido) -->
    <div id="card-modal">
        <div class="challenge-card cartoon-box" id="card-content">
            <h2 id="card-title">TÍTULO</h2>
            <i class="main-icon fa-solid fa-star" id="card-icon"></i>
            <p id="card-desc">Descripción</p>
            <button class="cartoon-btn close-card-btn" id="btn-close-modal">CERRAR</button>
        </div>
        <div id="modal-particles" class="particle-layer"></div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
